<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Am+zed Kingdoms — words</title>
<meta name="description" content="Sight-word drill. The device speaks a word; pick it from the choices. Difficulty adapts on word band and number of choices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* This page is only a frame. The drill brings its own markup and styles;
     see word-challenge.js. Everything here is page chrome. */
  :root{
    --sky-hi:#5CB8FF; --sky-lo:#1B4FD6;
    --panel:#0C1442; --edge:#040A22;
    --white:#FFFFFF; --steel:#8FA3D8; --gold:#FFD52E;
    --checker-a:#31A94F; --checker-b:#22833C;
    --pixel:"Press Start 2P",monospace;
    --screen:"Silkscreen","Press Start 2P",monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100%;
    background:linear-gradient(#8FD4FF 0%,var(--sky-hi) 28%,var(--sky-lo) 100%) fixed;
    color:var(--white);font-family:var(--screen);font-size:16px;line-height:1.55;
    image-rendering:pixelated;
    display:flex;justify-content:center;
    padding:clamp(12px,3.5vw,32px) 12px 120px;
  }
  body::before{
    content:"";position:fixed;left:0;right:0;bottom:0;height:96px;z-index:0;
    background-image:conic-gradient(var(--checker-a) 90deg,var(--checker-b) 0 180deg,var(--checker-a) 0 270deg,var(--checker-b) 0);
    background-size:48px 48px;border-top:5px solid var(--edge);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:60;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(4,10,34,.16) 0 2px,transparent 2px 4px);
  }
  .app{position:relative;z-index:1;width:100%;max-width:520px;display:flex;flex-direction:column;gap:clamp(12px,2.6vw,18px)}
  .panel{
    background:var(--panel);border:4px solid var(--white);
    box-shadow:0 0 0 4px var(--edge),7px 7px 0 4px rgba(4,10,34,.42);
    padding:clamp(12px,3.4vw,20px);
  }
  .title{
    font-family:var(--pixel);font-size:clamp(.82rem,4.1vw,1.25rem);
    line-height:1.35;margin:0;color:var(--gold);text-shadow:3px 3px 0 var(--edge);
  }
  .title span{color:var(--white)}
  .tagline{font-size:.9rem;color:var(--steel);margin:8px 0 0}
  .label{
    font-family:var(--pixel);font-size:.5rem;line-height:1.6;
    letter-spacing:.06em;color:var(--steel);text-transform:uppercase;
  }
  .hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .hud b{
    display:block;font-family:var(--pixel);font-size:.72rem;
    color:var(--gold);text-shadow:2px 2px 0 var(--edge);margin-top:5px;
  }
  /* the drill mounts here and supplies its own frame */
  #mount{display:block}
  .fail{
    background:#3A1015;border:4px solid var(--white);
    box-shadow:0 0 0 4px var(--edge);padding:18px;
  }
  .fail h2{font-family:var(--pixel);font-size:.62rem;margin:0 0 10px;color:#FF8A8A}
  .fail code{background:#0A1038;padding:2px 5px;color:var(--gold)}
</style>
</head>
<body>
<main class="app">

  <section class="panel">
    <h1 class="title">AM<span>+</span>ZED <span>WORDS</span></h1>
    <p class="tagline">Listen, then pick the word.</p>
    <div class="hud">
      <div><span class="label">Asked</span><b id="sAsked">0</b></div>
      <div><span class="label">Acc</span><b id="sAcc">--</b></div>
      <div><span class="label">Band</span><b id="sBand">--</b></div>
      <div><span class="label">Best</span><b id="sStreak">0</b></div>
    </div>
  </section>

  <div id="mount"></div>

</main>

<script src="profile.js"></script>
<script src="word-challenge.js"></script>
<script>
(function(){
  "use strict";
  var el=function(i){ return document.getElementById(i); };
  var mount=el("mount");

  /* This page IS the drill's frame, so unlike the maze it cannot fall back
     to anything. Say so plainly rather than showing an empty box. */
  if(typeof window.WordChallenge!=="function"){
    mount.className="fail";
    mount.innerHTML='<h2>THE DRILL DID NOT LOAD</h2>'+
      '<p><code>word-challenge.js</code> needs to sit in the same folder as '+
      'this file. If you downloaded them separately, put them together and reload.</p>';
    return;
  }

  /* Standalone: no lock to open, so nothing to count toward. */
  var handle = window.WordChallenge(mount, {
    kind:"language",
    required:Infinity,
    progress:0,
    variant:null,
    hints:{ showEvidence:true, showSettings:true }
  }, onAttempt);

  function onAttempt(){
    var S=window.WordChallengeState, t=S.tally(), z=S.zone();
    el("sAsked").textContent = t.asked;
    el("sAcc").textContent = t.asked ? Math.round(t.right/t.asked*100)+"%" : "--";
    el("sBand").textContent = z.band+"/"+z.opts;
    el("sStreak").textContent = t.best;
  }

  onAttempt();
  handle.focus();
  document.addEventListener("click",function(e){
    var t=e.target;
    if(!t||!t.closest) return;
    if(t.closest("button, input, label, a")) return;
    handle.focus();
  });
})();
</script>
</body>
</html>
